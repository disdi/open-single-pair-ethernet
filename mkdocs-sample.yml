# Project information
site_name: "Open Single Pair Ethernet"
site_description: "An open 10BASE-T1S (IEEE 802.3cg) MAC and digital PHY, from an external PHY through an FPGA to an open-PDK tape-out."
site_author: "Saket Sinha"
site_url: "https://saketsinha.de/open-single-pair-ethernet/"

# Copyright
copyright: "&copy; 2026 Saket Sinha"

# Repository
repo_name: "open-single-pair-ethernet"
repo_url: "https://github.com/disdi/open-single-pair-ethernet"
edit_uri: "edit/master/docs_sample/"

# Configuration
docs_dir: "docs_sample"
nav:
  - Home: index.md
  - Roadmap: roadmap.md
theme:
  name: "material"
  custom_dir: "overrides"
  language: "en"
  palette:
    primary: "blue"
    accent: "blue"
  features:
    - navigation.tabs

# Extensions
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - mdx_math:
      enable_dollar_delimiter: true
  - toc:
      permalink: true
      separator: "_"

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - en

# Customization
extra_javascript:
  - "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.6/MathJax.js?config=TeX-MML-AM_CHTML"
extra_css:
  - "assets/css/custom.css"
extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/disdi/open-single-pair-ethernet"

services:
  mkdocs:
    build: .
    image: open-single-pair-ethernet
    container_name: open_single_pair_ethernet
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    working_dir: /docs
    stdin_open: true
    tty: true
    command:
      - mkdocs
      - serve
      - --dev-addr=0.0.0.0:8000
